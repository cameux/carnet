<style>
/* équivalent du cadre que claude.ai ajoute autour de la page */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px/1.4 system-ui, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
/* écran de connexion */
.fb-gate { position: fixed; inset: 0; z-index: 100; background: var(--bg, #fff); color: var(--ink, #111); display: grid; place-items: center; padding: 24px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)) }
.fb-box { max-width: 360px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center }
.fb-logo { color: var(--acc, #d63c1e) } .fb-logo svg { width: 64px; height: 64px }
.fb-box h1 { font-size: 1.6rem; margin: 0 }
.fb-msg, .fb-prog { margin: 0; color: var(--muted, #666) }
.fb-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center }

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : mobile d'abord. En-tête collant (titre + ajout, recherche, catégories), grille de fiches,
   chaque vue (fiche, éditeur, import) en panneau plein écran avec sa barre collante et son entrée d'historique. */
/* Direction « Fiche technique » : noir sur blanc, filets fins, une seule couleur (--acc) pour signaler.
   Hiérarchie : nom du plat > temps > quantités (colonne en chiffres alignés, Geist Mono). */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --sunk: #f4f4f3;
  --ink: #111111;
  --muted: #6e6e6c;
  --line: #e6e6e4;
  --basil: #111111;     /* accent d'interface : encre */
  --basil-ink: #ffffff;
  --basil-soft: #f4f4f3;
  --acc: #d63c1e;       /* la seule couleur : catégorie, quantités recalculées, numéros */
  --saffron: #d63c1e;
  --saffron-soft: #fde8e2;
  --danger: #c4361c;
  --scrim: rgba(17, 17, 17, .45);
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 22px rgba(0,0,0,.10);
  --f-display: "Geist", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 6px;
  --tone-mix: 36%;     /* part de la couleur de la photo dans le fond d'une ligne */
  --tap: 44px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0f0f; --surface: #171717; --sunk: #1f1f1f; --ink: #f2f2f2; --muted: #9b9b98; --line: #2a2a2a;
  --basil: #f2f2f2; --basil-ink: #0f0f0f; --basil-soft: #1f1f1f; --acc: #ff6b4d; --saffron: #ff6b4d; --saffron-soft: #3a1b13; --danger: #f07a62; --tone-mix: 40%;
  --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f0f0f; --surface: #171717; --sunk: #1f1f1f; --ink: #f2f2f2; --muted: #9b9b98; --line: #2a2a2a;
  --basil: #f2f2f2; --basil-ink: #0f0f0f; --basil-soft: #1f1f1f; --acc: #ff6b4d; --saffron: #ff6b4d; --saffron-soft: #3a1b13; --danger: #f07a62; --tone-mix: 40%;
  --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100% }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gut-l); padding-right: var(--gut-r) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer; touch-action: manipulation }
:focus-visible { outline: 2px solid var(--basil); outline-offset: 2px }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 16px; font-weight: 500; white-space: nowrap; font-size: .95rem }
.btn:hover { border-color: var(--muted) }
.btn.primary { background: var(--basil); color: var(--basil-ink); border-color: var(--basil); font-weight: 600 }
.btn.ghost { background: transparent; border-color: transparent }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent }
.btn.icon { width: var(--tap); padding: 0; font-size: 1.15rem }
.btn.on { background: var(--basil-soft); border-color: var(--basil); color: var(--basil) }
.btn[disabled] { opacity: .5; cursor: default }
.btn svg { width: 20px; height: 20px; flex: none }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line) }
header.top .wrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; padding-block: 12px 10px; align-items: center }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0 }
.logo { width: 38px; height: 38px; flex: none; border-radius: 12px; background: var(--saffron-soft); color: var(--saffron); display: grid; place-items: center }
.logo svg { width: 28px; height: 28px; overflow: visible }
.logo .steam path { animation: steam 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom }
.logo .steam path:nth-child(2) { animation-delay: -1.1s }
.logo .steam path:nth-child(3) { animation-delay: -2.2s }
@keyframes steam { 0% { opacity: 0; transform: translateY(2px) scaleY(.8) } 35% { opacity: 1 } 75% { opacity: .5 } 100% { opacity: 0; transform: translateY(-3px) scaleY(1.1) } }
.brand h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; white-space: nowrap }
.brand .count { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; white-space: nowrap }
.search { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px 0 14px; min-height: var(--tap); min-width: 0 }
.search svg { color: var(--muted); flex: none }
.search input { border: 0; background: transparent; outline: none; width: 100%; min-width: 0; font-size: 16px; padding: 10px 0 }
.search input::-webkit-search-cancel-button { display: none }
.search .clear { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 50%; color: var(--muted); font-size: 1.2rem }
.chips { grid-column: 1 / -1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r)); padding-inline: var(--gut-l) var(--gut-r); scroll-padding-inline: var(--gut-l) }
.chips::-webkit-scrollbar { display: none }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; min-height: 36px; padding: 0 14px; font-size: .88rem; white-space: nowrap; color: var(--muted); flex: none }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip .n { opacity: .6; margin-left: 5px; font-variant-numeric: tabular-nums }
.add-label { display: none }
@media (min-width: 720px) {
  header.top .wrap { grid-template-columns: auto minmax(0, 1fr) auto }
  .search { grid-column: auto }
  .brand h1 { font-size: 1.7rem }
  .add-label { display: inline }
  #addBtn { width: auto; padding: 0 18px }
}

/* Menu d'ajout : feuille par le bas sur téléphone, menu sous le bouton sur grand écran */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30 }
.menu { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
  padding: 8px var(--gut-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gut-l); display: flex; flex-direction: column; gap: 2px; animation: up .18s ease-out }
.menu::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; margin: 4px 0 10px }
.menu h2 { font-size: 1.1rem; padding: 0 8px 8px }
.menu button { display: grid; grid-template-columns: 40px 1fr; gap: 0 12px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 8px; border-radius: 12px; min-height: 60px }
.menu button:hover, .menu button:active { background: var(--sunk) }
.menu .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; background: var(--basil-soft); display: grid; place-items: center; color: var(--basil) }
.menu .ic svg { width: 20px; height: 20px }
.menu b { font-weight: 600 }
.menu small { color: var(--muted); font-size: .82rem; line-height: 1.3 }
@keyframes up { from { transform: translateY(30px); opacity: 0 } }
@media (min-width: 720px) {
  .scrim.menu-scrim { background: transparent }
  .menu { left: auto; right: max(16px, calc((100vw - 1120px) / 2 + 16px)); bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 64px); width: 300px; border-radius: var(--r); padding: 6px; border: 1px solid var(--line); animation: none }
  .menu::before, .menu h2 { display: none }
}

/* Grille */
main .wrap { padding-block: 16px calc(48px + env(safe-area-inset-bottom, 0px)) }
.status { color: var(--muted); font-size: .9rem; margin-bottom: 12px }
.status:empty { display: none }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-align: left; padding: 0; transition: transform .15s ease, box-shadow .15s ease; min-width: 0 }
@media (hover: hover) { .card:hover { transform: translateY(-2px); box-shadow: var(--shadow) } }
.card:active { transform: scale(.98) }
.thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--sunk); position: relative; overflow: hidden }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block }
.thumb .mono { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 3rem; color: color-mix(in srgb, var(--basil) 50%, transparent); letter-spacing: -.04em }
.thumb .fav { position: absolute; top: 8px; right: 8px; background: var(--surface); color: var(--saffron); border-radius: 999px; width: 28px; height: 28px; display: grid; place-items: center; font-size: .9rem }
.card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0 }
.card h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.22; overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; gap: 2px 10px; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums }
.cat { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--basil); font-weight: 600 }
@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
  .card h3 { font-size: .96rem }
  .thumb .mono { font-size: 2.3rem }
  .card .body { padding: 8px 10px 10px }
}

/* État vide */
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 36px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px }
.empty h2 { font-size: 1.4rem }
.empty p { color: var(--muted); max-width: 46ch; margin: 0 }
.empty .opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }

/* Panneaux plein écran */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch }
.sheet .bar { position: sticky; top: 0; z-index: 3; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px) }
.sheet .bar .wrap { display: flex; align-items: center; gap: 6px; min-height: 56px }
.sheet .bar .sp { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px }
.sheet .bar .back { padding-left: 8px; margin-left: -8px }
.sheet .content { padding-block: 20px calc(40px + env(safe-area-inset-bottom, 0px)) }

/* Fiche recette */
.recipe { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 36px; align-items: start }
.hero-img { border-radius: var(--r); overflow: hidden; aspect-ratio: 4/3; max-width: 100%; background: var(--sunk); margin-bottom: 18px }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block }
/* Galerie : photo principale + photos des notes, à balayer */
.hero-img { position: relative }
.gal { display: flex; width: 100%; height: 100%; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; outline: none }
.gal::-webkit-scrollbar { display: none }
.gal img { flex: 0 0 100%; min-width: 100%; scroll-snap-align: center; scroll-snap-stop: always; user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none }
.dots { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px 9px; border-radius: 999px; background: rgba(12, 16, 14, .32); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); pointer-events: none }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .55); transition: width .3s var(--ease), background-color .3s var(--ease) }
.dots i.on { width: 18px; background: #fff }
.gal-cap { position: absolute; left: 12px; top: 12px; font-size: .74rem; font-weight: 600; letter-spacing: .02em; color: #fff; background: rgba(12, 16, 14, .38); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 999px; pointer-events: none; animation: fade .25s ease-out }
.gal-nav { display: none; position: absolute; top: 50%; margin-top: -18px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .9); color: #1c231f; place-items: center; box-shadow: 0 2px 10px rgba(0, 0, 0, .18) }
.gal-nav svg { width: 18px; height: 18px }
.gal-nav.prev { left: 10px } .gal-nav.next { right: 10px } .gal-nav.next svg { transform: rotate(180deg) }
@media (hover: hover) { .hero-img.multi:hover .gal-nav:not([disabled]) { display: grid } }
/* Photos dans les notes */
.nphotos { display: flex; gap: 8px; flex-wrap: wrap }
.nphoto { position: relative; width: 68px; height: 68px; border-radius: 10px; overflow: hidden; flex: none; padding: 0; border: 0; background: var(--sunk); transition: transform .15s var(--ease) }
button.nphoto:active { transform: scale(.94) }
.nphoto img { width: 100%; height: 100%; object-fit: cover; display: block }
.nphoto .x { position: absolute; top: 3px; right: 3px; width: 24px; height: 24px; border-radius: 50%; background: rgba(12, 16, 14, .6); color: #fff; border: 0; font-size: 15px; line-height: 1; display: grid; place-items: center; padding: 0 }
.nphoto.new { animation: pop .32s var(--spring) }
.mynote .nphotos { grid-column: 1 / -1; margin: 8px 0 2px }
.note-add .nphotos, .mynote.editing .nphotos { padding: 2px 6px }
.row .cam { margin-right: auto; color: var(--basil) }
.note-add .row .cam + small { margin-right: auto }
h2.title { font-size: clamp(1.7rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.06; margin: 4px 0 12px; overflow-wrap: anywhere }
.times { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; color: var(--muted); font-size: .88rem; margin: -4px 0 12px; font-variant-numeric: tabular-nums }
.times svg { width: 16px; height: 16px; margin-right: 6px; flex: none }
.times .time b { color: var(--ink); font-weight: 600 }
.times .time + .time::before { content: "·"; margin: 0 8px; color: var(--line) }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums }
.fact small { font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.fact b { font-weight: 600 }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px }
.tag { font-size: .8rem; background: var(--sunk); border-radius: 999px; padding: 3px 10px; color: var(--muted) }
.section-h { font-size: .76rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin: 0 0 10px; scroll-margin-top: 120px }
/* Bloc portions */
.yield { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 14px }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--bg) }
.stepper button { border: 0; background: transparent; width: var(--tap); height: var(--tap); font-size: 1.35rem; line-height: 1; border-radius: 50%; color: var(--basil) }
.stepper button:active { background: var(--sunk) }
.stepper button[disabled] { color: var(--line) }
.stepper output { min-width: 3ch; text-align: center; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums }
.yield .lbl { font-weight: 500 }
.yield .reset { margin-left: auto; border: 0; background: transparent; color: var(--basil); font-weight: 600; min-height: var(--tap); padding: 0 4px; font-size: .9rem }
.yield .units { flex-basis: 100%; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 2px }
.units-l { font-size: .82rem; color: var(--muted); font-weight: 600 }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex: 1; max-width: 330px }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; min-height: 34px; padding: 0 10px; font-size: .86rem; font-weight: 500; color: var(--muted); transition: background-color .25s var(--ease), color .25s var(--ease), box-shadow .25s var(--ease), transform .12s var(--ease) }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(20, 30, 24, .14) }
.seg button:active { transform: scale(.95) }
.units-tip { flex-basis: 100%; font-size: .78rem; color: var(--muted); margin: 0; border-top: 1px solid var(--line); padding-top: 8px }
.qa { border-bottom: 1.5px dotted color-mix(in srgb, var(--muted) 60%, transparent); cursor: pointer; border-radius: 3px; transition: background-color .2s var(--ease), border-color .2s var(--ease); -webkit-tap-highlight-color: transparent }
.qa:hover, .qa.on { background: var(--saffron-soft); border-bottom-color: var(--saffron) }
.qpop { position: fixed; z-index: 45; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 12px; font-size: .92rem; font-weight: 600; line-height: 1.4; box-shadow: var(--shadow); max-width: min(280px, calc(100vw - 16px)); font-variant-numeric: tabular-nums; animation: popIn .22s var(--spring) both; transform-origin: var(--ax, 50%) bottom }
.qpop.below { transform-origin: var(--ax, 50%) top }
.qpop .eq { opacity: .6; font-weight: 500 }
.qpop::after { content: ""; position: absolute; left: calc(var(--ax, 50%) - 6px); width: 12px; height: 12px; background: inherit; transform: rotate(45deg); border-radius: 2px }
.qpop.above::after { bottom: -5px } .qpop.below::after { top: -5px }
.qpop.out { opacity: 0; transform: scale(.92); transition: opacity .15s, transform .15s }
@keyframes popIn { from { opacity: 0; transform: scale(.85) } }
.yield .hint { flex-basis: 100%; font-size: .82rem; color: var(--muted); margin: -2px 0 0 }
.q { color: var(--saffron); font-weight: 700; background: var(--saffron-soft); border-radius: 4px; padding: 0 3px; font-variant-numeric: tabular-nums }
ul.ingr { list-style: none; padding: 0; margin: 0 0 28px; display: flex; flex-direction: column }

<script>
(() => {
"use strict";
// ÉCHELLE-DÉBUT
const FRAC = { "½": 1/2, "¼": 1/4, "¾": 3/4, "⅓": 1/3, "⅔": 2/3, "⅛": 1/8, "⅜": 3/8, "⅝": 5/8, "⅞": 7/8 };
const FR = "½¼¾⅓⅔⅛⅜⅝⅞";
const NUM = `(?:\\d+\\s+\\d+\\/\\d+|\\d+\\s*[${FR}]|\\d+\\/\\d+|\\d+(?:[.,]\\d+)?|[${FR}])`;

// Unités dont la quantité suit le nombre de portions
const MEASURE = new RegExp(`^\\s*(?:kg|mg|g|gr|grammes?|ml|cl|dl|l|litres?|lb|lbs|oz|t\\.|tasses?|c\\.?\\s*(?:à|a)\\s*(?:soupe|thé|the|café|cafe|s|c)${NOT_WORD}\\.?|càc|càs|cs|cc|cuill[eè]r[ée]es?|c\\.|pincées?|gousses?|tiges?|feuilles?|bâtons?|boîtes?|tranches?|lanières?|quartiers?|brins?|bouquets?|sachets?|cubes?)${NOT_WORD}`, "i");
const METRIC = new RegExp(`^\\s*(?:kg|mg|g|gr|grammes?|ml|cl|dl|l|litres?)${NOT_WORD}`, "i");

const FIXED = /^\s*(?:%|°|cm\b|mm\b|po\b|min|minutes?|h\b|heures?|jours?|semaines?|secondes?|x\b|×)/i;
// Mots qui désignent les portions servies, dans les étapes (« répartir dans 4 bols »)
const SERVING = new RegExp(`^\\s*(?:bols?|assiettes?|portions?|personnes?|parts?|verres?|boules?|pièces?|morceaux|carrés|naans?|pancakes?|crêpes?|ramequins?)${NOT_WORD}`, "i");

// Accord du mot qui suit la quantité (« 1 oignon » → « 2 oignons », « 2 filets » → « 1 filet »)
const NO_AGREE = /^(?:kg|mg|g|gr|ml|cl|dl|l|lb|lbs|oz|t|c|càc|càs|cs|cc|env|et|ou|à|de|d|du|des|le|la|les|au|aux|en|pour|par|bien|un|une|très|peu)$/i;

}

}
// Adjectifs et participes qui suivent le nom et s'accordent avec lui
const POST_ADJ = /^(?:vert|rouge|jaune|blanc|noir|fort|moyen|gros|petit|grand|mûr|dur|entier|grec|sec|cuit|cru|frit|épais|fin|long|court|rond|plat|mou|ferme|tendre|nature|bulgare)(?:e|s|es)?$/i;
const PARTICIPLE = /^[a-zà-ÿ]{3,}(?:é|ée|és|ées|i|ie|is|ies|u|ue|us|ues|it|ite|its|ites)$/i;
function agreeWord(w, toPl) {

// Réécrit les mots qui suivent la quantité selon le nombre ; renvoie [texteModifié, longueurConsommée]
function agree(rest, oldMax, newMax) {

// Changement d'unité quand la quantité devient trop petite ou trop grande
const U = {
  kg: /^\s*kg(?![a-zà-ÿ])/i, g: /^\s*(?:g|gr|grammes?)(?![a-zà-ÿ])/i,
  l: /^\s*(?:l|litres?)(?![a-zà-ÿ'’])/i, ml: /^\s*ml(?![a-zà-ÿ])/i,
  tasse: /^\s*(?:tasses?|t\.)(?![a-zà-ÿ])/i,
  cs: /^\s*(?:c\.?\s*(?:à|a)\s*(?:soupe|s)(?![a-zà-ÿ])\.?|càs|cs(?![a-zà-ÿ]))/i,
  cc: /^\s*(?:c\.?\s*(?:à|a)\s*(?:thé|the|café|cafe|c)(?![a-zà-ÿ])\.?|càc|cc(?![a-zà-ÿ]))/i,
};
function convertUnit(v, after) {
  let m;

  if ((m = after.match(U.kg)) && v < 1) return res(v * 1000, " g", m[0].length, true);
  if ((m = after.match(U.g)) && v >= 1000) return res(v / 1000, " kg", m[0].length, true);
  if ((m = after.match(U.l)) && v < 1) return res(v * 1000, " ml", m[0].length, true);
  if ((m = after.match(U.ml)) && v >= 1000) return res(v / 1000, " l", m[0].length, true);
  if ((m = after.match(U.tasse)) && v < 0.25) return res(v * 16, " c. à soupe", m[0].length, false);
  if ((m = after.match(U.cs)) && v < 1 && v * 3 >= 1/8) return res(v * 3, " c. à thé", m[0].length, false);
  if ((m = after.match(U.cs)) && v * 3 < 1/8) return { num: "1", unit: " pincée", len: m[0].length };

// Ce qui ne se coupe pas : œufs entiers, pincées, épices et gousses comptées à la pièce
const PIECE = /^\s*(?:gousses?|tiges?|feuilles?|bâtons?|tranches?|lanières?|quartiers?|brins?|cubes?|sachets?|boîtes?|clous?|grains?|bouquets?)(?![a-zà-ÿ])/i;

function roundCount(x, orig, after) {
  if (/^\s*(?:œufs?|oeufs?|jaunes?|blancs?)(?![a-zà-ÿ])/i.test(after) || PINCH.test(after)) return Math.max(1, Math.round(x));

// ---------- Changement de système d'unités (opts.sys = "metric" | "imperial") ----------
const B = "(?![a-zà-ÿ])";
const U_MET = `(?:kg|g|gr|grammes?|ml|cl|dl|l(?![a-zà-ÿ'’])|litres?|cm|°\\s*C)`;
const U_IMP = `(?:tasses?|t\\.|lbs?|livres?|oz|onces?|c\\.?\\s*(?:à|a)\\s*(?:soupe|thé|the|café|cafe|s|c)${B}\\.?|po|pouces?|°\\s*F)`;

    [new RegExp(`${sideB}\\s*\\/\\s*${sideA}`, "gi"), (all, i, m) => keepMet ? m : i],

  text = text.replace(new RegExp(`(${NUM})\\s*([x×])\\s*(${NUM})\\s*(cm|po|pouces)${B}`, "gi"), (all, a, x, b, u) => {
    const toImp = sys === "imperial" && /^cm$/i.test(u), toMet = sys === "metric" && !/^cm$/i.test(u);
    if (!toImp && !toMet) return all;
    const c = v => toImp ? fmtNum(roundTo(parseNum(v) / 2.54, .5), false) : fmtNum(Math.round(parseNum(v) * 2.54), true);
    return `${c(a)} × ${c(b)} ${toImp ? "po" : "cm"}`;

}
const CONV = {
  metric: [
    [new RegExp(`^\\s*(?:tasses?|t\\.)${B}`, "i"), "vol", 250],
    [new RegExp(`^\\s*c\\.?\\s*(?:à|a)\\s*(?:soupe|s)${B}\\.?`, "i"), "vol", 15],
    [new RegExp(`^\\s*c\\.?\\s*(?:à|a)\\s*(?:thé|the|café|cafe|c)${B}\\.?`, "i"), "vol", 5],
    [new RegExp(`^\\s*(?:lbs?|livres?)${B}`, "i"), "mass", 453.6],
    [new RegExp(`^\\s*(?:oz|onces?)${B}`, "i"), "mass", 28.35],
    [new RegExp(`^\\s*(?:po|pouces?)${B}`, "i"), "len", 2.54],
    [/^\s*°\s*F(?![a-zà-ÿ])/i, "tempF", 1],
  ],
  imperial: [
    [new RegExp(`^\\s*kg${B}`, "i"), "mass", 1000],
    [new RegExp(`^\\s*(?:g|gr|grammes?)${B}`, "i"), "mass", 1],
    [new RegExp(`^\\s*ml${B}`, "i"), "vol", 1],
    [new RegExp(`^\\s*cl${B}`, "i"), "vol", 10],
    [new RegExp(`^\\s*dl${B}`, "i"), "vol", 100],
    [/^\s*(?:l|litres?)(?![a-zà-ÿ'’])/i, "vol", 1000],
    [new RegExp(`^\\s*cm${B}`, "i"), "len", 1],
    [/^\s*°\s*C(?![a-zà-ÿ])/i, "tempC", 1],
  ],

const roundTo = (x, step) => Math.round(x / step) * step;
// Tasses -> ml selon l'usage canadien (¼ tasse = 60 ml, ¾ tasse = 175 ml…)
function cupsToMl(c) {
  const w = Math.floor(c + 1e-9), r = c - w;

// Convertit une quantité (ou une fourchette) vers le système voulu ; renvoie {t, len} ou null
function toSystem(a, b, after, sys) {

    const mm = after.match(re); if (!mm) continue;

      else { unit = " cm"; conv = v => v; }
    } else {
      if (kind === "vol") {
        if (top >= 60) { unit = "tasse"; conv = v => v / 250; } else if (top >= 15) { unit = " c. à soupe"; conv = v => v / 15; } else { unit = " c. à thé"; conv = v => v / 5; }
      } else if (kind === "mass") { if (top >= 450) { unit = " lb"; conv = v => roundTo(v / 453.6, .25); } else { unit = " oz"; conv = v => { const o = v / 28.35; return Math.max(.25, roundTo(o, o >= 4 ? .5 : .25)); }; } }
      else { unit = " po"; conv = v => { const i = v / 2.54; return Math.max(.25, roundTo(i, i >= 4 ? .5 : .25)); }; }
    }
    const nums = vals.map(v => conv(v));
    const f = x => kind.startsWith("temp") ? String(x) : fmtNum(x, metric);

    return { t: nums.map(f).join(" à ") + unit, len: mm[0].length };

}

// Découpe un texte en morceaux [{t, s}] où s=true marque une quantité recalculée.
// opts.leading : la quantité en tête de ligne est celle de l'ingrédient (lignes d'ingrédients)
// opts.servings : nombre de portions d'origine (pour « répartir dans 4 bols »)
function scaleText(text, f, opts = {}) {
  text = String(text ?? "");

      const sizeOf = /\b(?:de|d['’])\s*(?:environ\s+|env\.\s*)?$/i.test(before);
      // « (28 oz) » juste après une taille d'unité : même chose
      const sizeParen = new RegExp(`\\b(?:de|d['’])\\s*(?:environ\\s+)?${NUM_SRC}\\s*[A-Za-zÀ-ÿ.]+\\s*\\(\\s*(?:env\\.\\s*|environ\\s+)?$`, "i").test(before);

      const perHead = /^\s*\S+\s*(?:\S+\s+)?(?:par|pour)\s+(?:personne|portion|pers\b|pièce|naan|boule)/i.test(after);

      agreeIt = !METRIC.test(after);

      scale = parseNum(m[1]) === opts.servings;

    if (a == null) continue;
    // changement de système : la quantité (recalculée ou non) passe dans l'autre unité
    const sysConv = sys && (b != null || !m[3]) ? toSystem(scale ? a * f : a, b == null ? null : (scale ? b * f : b), after, sys) : null;
    if (sysConv) {
      if (start > last) out.push({ t: text.slice(last, start), s: false });
      out.push({ t: sysConv.t, s: true });
      last = end + sysConv.len; re.lastIndex = last;
      continue;
    }
    if (!scale || !changing) continue;
    const metric = METRIC.test(after);
    const unitless = !MEASURE.test(after) || PIECE.test(after) || PINCH.test(after);
    const sc = x => unitless ? roundCount(x * f, x, after) : x * f;
    if (start > last) out.push({ t: text.slice(last, start), s: false });
    const conv = !m[3] ? convertUnit(a * f, after) : null;
    if (conv) {
      out.push({ t: conv.num + conv.unit, s: true });
      last = end + conv.len; re.lastIndex = last;
      continue;
    }
    let t = fmtNum(sc(a), metric);
    if (m[3]) t += m[2] + (b != null ? fmtNum(sc(b), metric) : m[3]);
    out.push({ t, s: true });
    last = end;

// Réduit une image à 1600 px avant envoi
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 900000) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(b => res(b || file), "image/jpeg", .85));
  } catch { return file; }
}

// ---------- Extraction par Claude ----------
const FORMAT = `Réponds uniquement avec un objet JSON de la forme :
{"recettes":[{"titre":"…","categorie":"une valeur parmi ${CATS.join(", ")}","portions":4,"portionsUnite":"personnes","tempsPrep":20,"prepEstime":false,"tempsCuisson":45,"etiquettes":["…"],"ingredients":["200 g de farine","Pour la sauce :","2 c. à soupe (30 ml) de beurre"],"etapes":["…","…"],"notes":"…","source":"…"}]}
Règles :
- N'invente rien. Un champ absent du texte vaut null (nombres) ou "" / [] (textes, listes).
- portions : le rendement indiqué (nombre). portionsUnite : ce qu'il compte, au pluriel (« personnes », « portions », « naans », « biscuits », « carrés »…).
- tempsPrep et tempsCuisson en minutes. Si le temps de préparation n'est pas indiqué, estime le temps de travail actif d'après les étapes (sans marinade ni repos) et mets "prepEstime": true ; sinon "prepEstime": false.
- Un ingrédient par élément, la quantité en tout premier, en chiffres (« 2 œufs », pas « deux œufs »). Garde les unités d'origine et les équivalences entre parenthèses (« 1 c. à soupe (15 ml) »). Un sous-groupe d'ingrédients devient un élément qui finit par « : ».
- Une étape par élément, sans numéro. Écris les nombres en chiffres.
- Écris en français ; si la recette est dans une autre langue, traduis-la.
- notes : astuces, variantes, remarques personnelles présentes dans le texte.
- etiquettes : 0 à 4 mots courts utiles pour chercher (ex. végé, rapide, four).`;
function cleanRecipe(x) {
  const arr = v => Array.isArray(v) ? v.map(s => String(s ?? "").trim()).filter(Boolean) : [];
  const num = v => (v == null || v === "" || isNaN(Number(v))) ? null : Math.round(Number(v));
  return {
    titre: String(x?.titre || "").trim(), categorie: CATS.includes(x?.categorie) ? x.categorie : "Autres",
    portions: num(x?.portions), portionsUnite: String(x?.portionsUnite || "").trim().slice(0, 30),
    tempsPrep: num(x?.tempsPrep), tempsCuisson: num(x?.tempsCuisson), prepEstime: !!x?.prepEstime && num(x?.tempsPrep) != null,
    etiquettes: arr(x?.etiquettes).slice(0, 6), ingredients: arr(x?.ingredients), etapes: arr(x?.etapes),
    notes: String(x?.notes || "").trim(), source: String(x?.source || "").trim(),
  };
}
function sampleErr(e) {
  const c = e?.code;
  if (c === "not_granted") return `Tu as refusé que la page utilise ${IA}. Recharge la page pour qu'elle le redemande.`;
  if (c === "rate_limited") return "Trop de demandes d'un coup. Réessaie dans un moment.";
  if (c === "image_rejected") return "Cette image n'est pas lisible. Essaie un JPEG ou PNG plus petit.";

  if (c === "invalid_json") return "La réponse n'était pas exploitable. Réessaie.";

  if (c === "session_expired") return "Ta session a expiré. Reconnecte-toi à claude.ai.";

}
async function extract(prompt, images, msgBox, btn, extra = {}) {

  openSheet("import-lien", [backBtn(), el("span", { class: "sp", text: "Depuis un lien" }), go_],
    [el("p", { class: "intro", text: sample?.lienDirect ? "Colle l'adresse de la recette : la page est lue automatiquement. Si le site refuse, colle aussi le texte de la page." : "Dans l'app Claude sur ordinateur, la page est lue toute seule à partir de l'adresse. Sur téléphone, colle aussi le texte de la page." }),
     el("div", { class: "form" },
       el("div", { class: "field" }, el("label", { for: "l-url", text: "Adresse de la recette" }), url),
       el("div", { class: "field" }, el("label", { for: "l-text", text: "Texte de la page" }), pasted)),
     msg]);
};
// Lecture d'une page web par le navigateur intégré de l'app Claude (ordinateur seulement)
async function readPage(u, msg, btn) {
  if (!mcp) { msg.replaceChildren(el("div", { class: "msg err", text: "Lecture automatique indisponible ici. Colle le texte de la page dans le second champ." })); return null; }
  btn.disabled = true; const old = btn.textContent;
  btn.replaceChildren(el("span", { class: "spin" }), " Ouverture…");
  try {
    await mcp.callTool("host:claude_browser", "navigate", { url: u });
    const res = await mcp.callTool("host:claude_browser", "get_page_text", { max_chars: 60000 });
    const t = typeof res.payload === "string" ? res.payload : (res.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
    if (!t || t.length < 200) throw { code: "empty" };
    return t;
  } catch (e) {
    const why = e?.code === "server_not_connected" ? "Lecture automatique possible seulement dans l'app Claude sur ordinateur."
      : e?.code === "cancelled" || e?.code === "not_in_manifest" ? "Lecture de la page refusée."
      : "La page n'a pas pu être lue.";
    msg.replaceChildren(el("div", { class: "msg err", text: why + " Colle le texte de la page dans le second champ, puis relance." }));
    return null;
  } finally { btn.disabled = false; btn.textContent = old; }
}

// ---------- Démarrage ----------
renderAll();
const loadTimer = setTimeout(() => { if (!loaded) $("#status").textContent = "Le carnet ne répond pas encore. Vérifie ta connexion ; la page continue d'essayer."; }, 10000);
function onData(list) {
  recettes = list;
  const first = !loaded;
  loaded = true; renderAll();
  if (current?.hash?.startsWith("r-")) { const y = sheet.scrollTop; const h = current.hash; current = null; openRecipe(h.slice(2), { quiet: true }); sheet.scrollTop = y; }
  else if (first) route();
}
(async () => {
  const cl = window.claude;
  if (!cl?.use) {
    clearTimeout(loadTimer);
    if (Array.isArray(window.__DEMO)) { onData(window.__DEMO.map(x => ({ ...x }))); return; }
    loaded = true; $("#status").textContent = "Ouvre cette page dans claude.ai pour voir et enregistrer les recettes."; renderAll(); return;
  }
  const [d, a, s, m, u] = await Promise.all(["db", "assets", "sample", "mcp", "user"].map(n => cl.use(n).catch(() => null)));
  db = d; assets = a; sample = s; mcp = m;
  if (u) { try { const w = await u.can("data.write"); if (w === false) canWrite = false; } catch {} }
  if (!canWrite) addBtn.hidden = true;
  if (!db) { clearTimeout(loadTimer); loaded = true; $("#status").textContent = "Connecte-toi à claude.ai pour voir le carnet."; renderAll(); return; }
  db.collection("recettes").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); $("#status").textContent = ""; }
    onData(snap.docs.map(x => ({ id: x.id, ...x.data() })));
  }, e => { clearTimeout(loadTimer); loaded = true; $("#status").textContent = "Le carnet est inaccessible (" + e.code + ")."; renderAll(); });
})();
})();
</script>
