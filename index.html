<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carnet</title>
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#f8ebcf">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icone.svg">
<link rel="manifest" href="manifest.webmanifest">
<script>
  // Lancée depuis l'icône de l'écran d'accueil (adresse enregistrée avec ?ouvrir) : on file directement au carnet.
  var CARNET = "https://claude.ai/artifact/UAdoBjntUvv9Y28CGQKwjS";
  if (location.search.indexOf("ouvrir") !== -1) location.replace(CARNET);
</script>
<style>
  :root { --bg: #f8ebcf; --ink: #3b2a08; --saffron: #b97a0c; --muted: #7a6439 }
  @media (prefers-color-scheme: dark) { :root { --bg: #241c0c; --ink: #f6e9cc; --saffron: #f0b74a; --muted: #c2a877 } }
  * { box-sizing: border-box }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) }
  main { max-width: 380px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 18px }
  .logo { width: 112px; height: 112px; border-radius: 26px; background: rgba(185, 122, 12, .12); color: var(--saffron); display: grid; place-items: center }
  .logo svg { width: 84px; height: 84px; overflow: visible }
  .steam path { animation: steam 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom }
  .steam path:nth-child(2) { animation-delay: -1.1s } .steam path:nth-child(3) { animation-delay: -2.2s }
  @keyframes steam { 0% { opacity: 0; transform: translateY(2px) scaleY(.8) } 35% { opacity: 1 } 75% { opacity: .5 } 100% { opacity: 0; transform: translateY(-3px) scaleY(1.1) } }
  @media (prefers-reduced-motion: reduce) { .steam path { animation: none } }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: -.02em }
  a.go { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 28px; border-radius: 999px; background: var(--saffron); color: #fff; font-weight: 600; text-decoration: none }
  ol { text-align: left; color: var(--muted); font-size: .92rem; margin: 6px 0 0; padding-left: 1.3em }
  ol li { margin: 4px 0 }
  b { color: var(--ink) }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="steam"><path d="M11 9c-1.4-1.3 1.4-2.7 0-4"/><path d="M16 8.5c-1.6-1.5 1.6-3 0-4.5"/><path d="M21 9c-1.4-1.3 1.4-2.7 0-4"/></g><path d="M14.5 12.3h3"/><path d="M6 15h20"/><path d="M7.5 15v8.5A3.5 3.5 0 0 0 11 27h10a3.5 3.5 0 0 0 3.5-3.5V15"/><path d="M7.5 18H4.5M24.5 18h3"/></svg></div>
  <h1>Carnet de cuisine</h1>
  <a class="go" id="go" href="https://claude.ai/artifact/UAdoBjntUvv9Y28CGQKwjS">Ouvrir le carnet</a>
  <ol>
    <li>Dans Safari, touche <b>Partager</b>.</li>
    <li>Choisis <b>Ajouter à l'écran d'accueil</b>, puis <b>Ajouter</b>.</li>
    <li>L'icône casserole ouvrira directement le carnet.</li>
  </ol>
</main>
<script>
  // L'adresse enregistrée sur l'écran d'accueil porte ?ouvrir : au lancement, la page renvoie tout de suite au carnet.
  try { history.replaceState(null, "", location.pathname + "?ouvrir"); } catch (e) {}
</script>
</body>
</html>
